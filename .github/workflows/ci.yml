
# Required checks: the job names below (lint, validate, test) are the checks
# the branch ruleset is meant to require. A renamed job leaves its old name
# required but never reported, so every PR waits on it ("Expected"); update
# the ruleset together with any rename.
#
# Every action is pinned to a full commit SHA; the trailing comment names the
# release it corresponds to. Jobs run on ubuntu-26.04 rather than
# ubuntu-latest, so moving to the next Ubuntu release happens in a reviewed
# PR. GitHub still refreshes that image every week, so the lint tools that
# decide pass/fail (shellcheck, shfmt, actionlint) are downloaded at pinned
# versions and checked against their sha256 instead of being taken from the
# image. The Python dev tools come from uv.lock, which pins each by hash,
# installed by uv at UV_VERSION.

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  PYTHON_VERSION: "3.13"
  # uv, which installs the dev group as uv.lock pins it. Bump deliberately,
  # together with mise.toml's pin, which lint checks this against: newer
  # releases can read and write uv.lock differently.
  UV_VERSION: "0.13.4"
  # uv builds its environments from setup-python's interpreter, never from a
  # Python it downloads.
  UV_PYTHON_PREFERENCE: only-system
  NODE_VERSION: "24"
  # Claude Code CLI used by the validate job. Bump deliberately: newer releases
  # can add validation checks.
  CLAUDE_CODE_VERSION: "2.1.323"

jobs:
  lint:
    name: lint
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    env:
      # Shell files held to shellcheck and shfmt, as git pathspecs. Formatting
      # style comes from .editorconfig.
      SHELL_FILES: scripts/bw tests/run.sh tests/scripts/helpers.bash
      # sha256 values are the digests GitHub records for these release assets.
      SHELLCHECK_VERSION: "0.11.0"
      SHELLCHECK_SHA256: "8c3be12b05d5c177a04c29e3c78ce89ac86f1595681cab149b65b97c4e227198"
      SHFMT_VERSION: "3.14.1"
      SHFMT_SHA256: "76e77641faa025814b77f153b29796b8e6fa2fca03e0c76a691608b86c7ea7bf"
      ACTIONLINT_VERSION: "1.7.12"
      ACTIONLINT_SHA256: "8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: false

      - name: Install the dev tools from uv.lock
        run: uv sync --locked

      - name: JSON manifests parse
        run: |
          for f in .claude-plugin/plugin.json .claude-plugin/marketplace.json hooks/hooks.json; do
            jq -e . "$f" > /dev/null || { echo "::error file=$f::$f is not valid JSON"; exit 1; }
          done

      - name: Agent and skill frontmatter is strict YAML
        run: uv run --no-sync python .github/scripts/lint-frontmatter.py agents/*.md skills/*/SKILL.md .claude/skills/*/SKILL.md

      - name: The lang-ci workflows pass their checks
        run: |
          w=.github/workflows
          for f in "$w"/lang-ci-*.yml; do
            l=${f#"$w"/lang-ci-}; l=${l%.yml}
            test "$(sed '1,/^jobs:$/d' "$f" | grep -E '^  [^ #]')" = "  $l:"  # a job not named by the file's id, or a second job
            if grep -q '^    if:' "$f"; then exit 1; fi  # a job-level if:, which skips the job instead of failing it [R69]
            test "$(grep -A3 -x "  lang-ci-fixture-$l:" "$w/ci.yml")" = "$(printf '  lang-ci-fixture-%s:\n    uses: ./.github/workflows/lang-ci-%s.yml\n    with:\n      directory: tests/fixtures/lang-ci/%s' "$l" "$l" "$l")"  # no fixture job for the file
            test "$(grep -c 'uses: actions/checkout@' "$f")" = "$(grep -c 'persist-credentials: false' "$f")"  # a checkout keeps credentials
            if grep -E '^ +(- )?uses:' "$f" | grep -vqE 'uses: [^@[:space:]]+@[0-9a-f]{40}( #|$)'; then exit 1; fi  # a uses: not pinned by SHA
            test "$(grep -cE '^ *permissions:' "$f")" = 1  # a second permissions: key
            test "$(grep -A2 -x 'permissions:' "$f")" = "$(printf 'permissions:\n  contents: read\njobs:')"  # more than contents: read
            if grep -v '^ *#' "$f" | grep -qE 'secrets|pull_request_target'; then exit 1; fi  # secrets or pull_request_target
            test "$(grep -c '^    timeout-minutes: [$]{{ inputs[.]timeout-minutes }}$' "$f")" = 1  # a job without the timeout
          done
          test "$(grep -hoE 'uses: [^@[:space:]]+@' "$w"/lang-ci-*.yml | sort -u | wc -l)" = "$(grep -hoE 'uses: [^@[:space:]]+@[0-9a-f]{40}' "$w"/lang-ci-*.yml | sort -u | wc -l)"  # an action pinned at two SHAs
          test "$(grep -cE '^ +cargo (build|test|clippy) --workspace ' "$w/lang-ci-rust.yml")" = 3  # a cargo command without --workspace, which the fixture can't detect [R84]
          grep -qx CHECKSUMS tests/fixtures/lang-ci/ruby/Gemfile.lock  # no CHECKSUMS section
          grep -qE '^  rake \([0-9.]+\) sha256=[0-9a-f]{64}$' tests/fixtures/lang-ci/ruby/Gemfile.lock  # a CHECKSUMS entry without its hash

      # scripts/_vendor/yaml/ is the sdist's lib/yaml/, unmodified, next to its
      # LICENSE. The sdist is checked against the sha256 recorded in the
      # repository before anything is extracted from it.
      - name: The vendored PyYAML matches its sdist
        run: |
          curl -fsSL --retry 3 -o "$RUNNER_TEMP/pyyaml.tar.gz" \
            "https://files.pythonhosted.org/packages/05/8e/961c0007c59b8dd7729d542c61a4d537767a59645b82a0b521206e1e25c2/pyyaml-6.0.3.tar.gz"
          echo "$(cut -d' ' -f1 scripts/_vendor/PyYAML-6.0.3.sha256)  $RUNNER_TEMP/pyyaml.tar.gz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/pyyaml.tar.gz" -C "$RUNNER_TEMP"
          diff -r -x __pycache__ "$RUNNER_TEMP/pyyaml-6.0.3/lib/yaml" scripts/_vendor/yaml
          cmp "$RUNNER_TEMP/pyyaml-6.0.3/LICENSE" scripts/_vendor/PyYAML-LICENSE

      # load_frontmatter in scripts/_lib/bw.py parses YAML only through its
      # alias-refusing, size-capped loader, and nothing else may parse it.
      # git grep exits 1 when nothing matches, so a match or an error fails.
      - name: Only load_frontmatter loads YAML
        run: |
          rc=0
          git grep -nE 'yaml\.(load|safe_load|full_load|unsafe_load)\(|Loader=' -- scripts skills hooks ':!scripts/_lib/bw.py' ':!scripts/_vendor' || rc=$?
          test "$rc" = 1

      - name: CI's lint tool versions match mise.toml
        run: |
          grep -qxF "shellcheck = \"$SHELLCHECK_VERSION\"" mise.toml
          grep -qxF "shfmt = \"$SHFMT_VERSION\"" mise.toml
          grep -qxF "\"aqua:rhysd/actionlint\" = \"$ACTIONLINT_VERSION\"" mise.toml
          grep -qxF "\"aqua:astral-sh/uv\" = \"$UV_VERSION\"" mise.toml

      - name: Install shellcheck, shfmt and actionlint
        run: |
          bin="$RUNNER_TEMP/bin"
          mkdir -p "$bin"
          curl -fsSL --retry 3 -o "$RUNNER_TEMP/shellcheck.tar.xz" \
            "https://github.com/koalaman/shellcheck/releases/download/v${SHELLCHECK_VERSION}/shellcheck-v${SHELLCHECK_VERSION}.linux.x86_64.tar.xz"
          echo "${SHELLCHECK_SHA256}  $RUNNER_TEMP/shellcheck.tar.xz" | sha256sum -c -
          tar -xJf "$RUNNER_TEMP/shellcheck.tar.xz" -C "$bin" --strip-components=1 "shellcheck-v${SHELLCHECK_VERSION}/shellcheck"
          curl -fsSL --retry 3 -o "$bin/shfmt" \
            "https://github.com/mvdan/sh/releases/download/v${SHFMT_VERSION}/shfmt_v${SHFMT_VERSION}_linux_amd64"
          echo "${SHFMT_SHA256}  $bin/shfmt" | sha256sum -c -
          curl -fsSL --retry 3 -o "$RUNNER_TEMP/actionlint.tar.gz" \
            "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          echo "${ACTIONLINT_SHA256}  $RUNNER_TEMP/actionlint.tar.gz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/actionlint.tar.gz" -C "$bin" actionlint
          chmod +x "$bin/shellcheck" "$bin/shfmt" "$bin/actionlint"
          echo "$bin" >> "$GITHUB_PATH"

      # Info-level notes are advisory; warnings and errors fail the job.
      - name: Shell scripts pass shellcheck
        run: |
          set -f  # SHELL_FILES holds git pathspecs; keep bash from globbing them
          shellcheck --version
          # shellcheck disable=SC2086 # split on purpose, one pathspec per word; set -f stops globbing
          git ls-files -z -- $SHELL_FILES | xargs -0 shellcheck -x --source-path=SCRIPTDIR --severity=warning

      - name: Shell scripts are shfmt-formatted
        run: |
          set -f  # SHELL_FILES holds git pathspecs; keep bash from globbing them
          shfmt --version
          # shellcheck disable=SC2086 # split on purpose, one pathspec per word; set -f stops globbing
          git ls-files -z -- $SHELL_FILES | xargs -0 shfmt -d

      # After the install step, so actionlint runs the pinned shellcheck on every run: block.
      - name: Workflows pass actionlint
        run: |
          actionlint -version
          actionlint -config-file .github/actionlint.yaml .github/workflows/*.yml

      # Last, so a broken link no longer skips the steps above it.
      - name: Relative Markdown links resolve
        run: python .github/scripts/check-links.py

  validate:
    name: validate
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          package-manager-cache: false

      - name: Install Claude Code CLI
        run: npm install --global --no-audit --no-fund "@anthropic-ai/claude-code@${CLAUDE_CODE_VERSION}"

      # Warnings (such as the root CLAUDE.md not being loaded as plugin
      # context) are reported but do not fail the job; --strict would.
      - name: claude plugin validate
        env:
          CLAUDE_CODE_DISABLE_NONESSENTIAL_TRAFFIC: "1"
        run: |
          claude --version
          claude plugin validate . --json

  test:
    name: test
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive
          persist-credentials: false

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        id: py
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: false

      # pytest, and PyYAML, which lets the ci.yml rendering tests parse their
      # output instead of skipping.
      - name: Install the dev tools from uv.lock
        run: uv sync --locked

      # uv run puts the environment's python3, which has PyYAML, first on
      # PATH. BYTEWYRD_PYTHON makes scripts/bw run the interpreter set up above.
      - name: Run the bats suite
        env:
          BYTEWYRD_PYTHON: ${{ steps.py.outputs.python-path }}
        run: uv run --no-sync tests/run.sh

      - name: Run pytest
        env:
          BYTEWYRD_PYTHON: ${{ steps.py.outputs.python-path }}
        run: uv run --no-sync pytest -q tests/py tests/e2e

  # Not required checks: the ruleset requires only lint, validate and test.
  # One job per lang-ci-<id>.yml runs that file on its fixture; they are
  # separate jobs, not a matrix, because `uses:` takes no expressions. The local
  # `./` calls run the lang-ci files from this same commit, so they take no pin.
  # The header's ubuntu-26.04 rule covers the jobs defined in this file; a job
  # that calls a reusable workflow can't set runs-on, so the lang-ci files' jobs
  # run on their ubuntu-latest, as they do for the repositories that call them.
  lang-ci-fixture-go:
    uses: ./.github/workflows/lang-ci-go.yml
    with:
      directory: tests/fixtures/lang-ci/go
  lang-ci-fixture-js:
    uses: ./.github/workflows/lang-ci-js.yml
    with:
      directory: tests/fixtures/lang-ci/js
  lang-ci-fixture-python:
    uses: ./.github/workflows/lang-ci-python.yml
    with:
      directory: tests/fixtures/lang-ci/python
  lang-ci-fixture-ruby:
    uses: ./.github/workflows/lang-ci-ruby.yml
    with:
      directory: tests/fixtures/lang-ci/ruby
  lang-ci-fixture-rust:
    uses: ./.github/workflows/lang-ci-rust.yml
    with:
      directory: tests/fixtures/lang-ci/rust

  # bats and pytest on the oldest supported Python under Linux and the latest
  # 3.x under macOS, each with the dev tools from uv.lock. They include PyYAML,
  # since under CI ci-lint.bats and rfc-set-status.bats fail without it.
  compat:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-26.04
            python: "3.11"
          - os: macos-15
            python: "3.x"
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        id: py
        with:
          python-version: ${{ matrix.python }}
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: false
      - run: uv sync --locked
      - env:
          BYTEWYRD_PYTHON: ${{ steps.py.outputs.python-path }}
        run: |
          uv run --no-sync tests/run.sh
          uv run --no-sync pytest -q tests/py tests/e2e

  # bats at every commit of the pull request, and the caller template's pin.
  # A bats run takes about a minute, so 120 minutes cover about 100 commits.
  history:
    runs-on: ubuntu-26.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          submodules: recursive
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        id: py
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: false
      # Once, at HEAD: the commits before uv.lock have none.
      - run: uv sync --locked
      - name: bats passes at every commit, and no port commit edits tests/scripts
        env:
          BYTEWYRD_PYTHON: ${{ steps.py.outputs.python-path }}
        run: |
          # HEAD's environment stays first on PATH at every commit, so older
          # commits still get pytest and PyYAML.
          export PATH="$PWD/.venv/bin:$PATH"
          base=$(git merge-base origin/main HEAD); h=$(git rev-parse HEAD); bad=0
          for c in $(git rev-list --reverse "$base..HEAD"); do
            git checkout -q --recurse-submodules "$c"
            if ! tests/run.sh > "$RUNNER_TEMP/bats-$c.log" 2>&1; then
              echo "::group::bats fails at $c"; cat "$RUNNER_TEMP/bats-$c.log"; echo "::endgroup::"; bad=1
            fi
          done
          git checkout -q --recurse-submodules "$h"
          for c in $(git rev-list --grep='^refactor(scripts): port ' "$base..HEAD"); do git diff --quiet "$c^" "$c" -- tests/scripts || { echo "::error::$c edits tests/scripts"; bad=1; }; done
          exit "$bad"
      - name: The caller template pins a main commit that has every lang-ci file
        if: ${{ !cancelled() }}
        run: |
          tpl=templates/scaffold/ci-caller.yml.tpl
          pin=$(sed -n 's|^@@job@@     uses: bytewyrd/claude-bytewyrd/\.github/workflows/lang-ci-@@job_language@@\.yml@\([0-9a-f]\{40\}\)$|\1|p' "$tpl")
          test "$(grep -c 'uses:' "$tpl")" = 1
          test "${#pin}" = 40
          git merge-base --is-ancestor "$pin" origin/main
          for f in .github/workflows/lang-ci-*.yml; do git cat-file -e "$pin:$f"; done
      - name: No lang-ci change is waiting for its pin bump
        if: ${{ !cancelled() }}
        run: |
          tpl=templates/scaffold/ci-caller.yml.tpl
          pin=$(sed -n 's|^@@job@@     uses: bytewyrd/claude-bytewyrd/\.github/workflows/lang-ci-@@job_language@@\.yml@\([0-9a-f]\{40\}\)$|\1|p' "$tpl")
          if ! git diff --quiet "$pin" HEAD -- '.github/workflows/lang-ci*'; then
            if git diff --quiet origin/main HEAD -- "$tpl"; then
              echo "::warning::the lang-ci files differ from the pinned $pin; bump the pin after this merges"
            else
              echo "::error::the new pin $pin does not match this commit's lang-ci files"; exit 1
            fi
          fi

  # Installs the plugin into a temporary HOME, from this checkout and as an
  # update of an install of main, and fails on any plugin load error.
  install-check:
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: curl -fsSL https://claude.ai/install.sh | bash -s "$CLAUDE_CODE_VERSION"
      - name: Install from this checkout
        run: |
          CLAUDE="$HOME/.local/bin/claude"
          HOME=$(mktemp -d)
          export HOME
          "$CLAUDE" plugin marketplace add anthropics/claude-plugins-official
          "$CLAUDE" plugin marketplace add "$GITHUB_WORKSPACE"
          "$CLAUDE" plugin install bytewyrd@bytewyrd
          "$CLAUDE" plugin list --json | jq -e 'all(.[]; (.errors // []) | length == 0)'
      # A local clone can't stand in for the update: Claude Code loads a
      # local-path marketplace's plugin in place, with no update step.
      - name: Update an install of main
        run: |
          CLAUDE="$HOME/.local/bin/claude"
          HOME=$(mktemp -d)
          export HOME
          ref=${GITHUB_HEAD_REF:-$GITHUB_REF_NAME}
          "$CLAUDE" plugin marketplace add anthropics/claude-plugins-official
          "$CLAUDE" plugin marketplace add bytewyrd/claude-bytewyrd
          for dep in github context7 code-review; do "$CLAUDE" plugin install "$dep@claude-plugins-official"; done
          "$CLAUDE" plugin install bytewyrd@bytewyrd
          # marketplace add refuses a source that differs from the marketplace's
          # extraKnownMarketplaces entry, so the entry gets the ref first.
          jq --arg ref "$ref" '.extraKnownMarketplaces.bytewyrd.source.ref = $ref' "$HOME/.claude/settings.json" > "$RUNNER_TEMP/settings.json"
          mv "$RUNNER_TEMP/settings.json" "$HOME/.claude/settings.json"
          "$CLAUDE" plugin marketplace add "bytewyrd/claude-bytewyrd#$ref"
          CLAUDE_CODE_DISABLE_NONESSENTIAL_TRAFFIC=1 "$CLAUDE" plugin update bytewyrd@bytewyrd
          "$CLAUDE" plugin list --json | jq -e 'all(.[]; (.errors // []) | length == 0)'
