# bootstrap-content-version: bytewyrd/.github/workflows/ci.yml@bc393baf:e3b0c44298fc

# Required checks: the job names below (lint, validate, test) are the checks
# the branch ruleset is meant to require. A renamed job leaves its old name
# required but never reported, so every PR waits on it ("Expected"); update
# the ruleset together with any rename.
#
# Every action is pinned to a full commit SHA; the trailing comment names the
# release it corresponds to. Jobs run on ubuntu-26.04 rather than
# ubuntu-latest, so moving to the next Ubuntu release happens in a reviewed
# PR. GitHub still refreshes that image every week, so the lint tools that
# decide pass/fail (shellcheck, shfmt) are downloaded at pinned versions and
# checked against their sha256 instead of being taken from the image.

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  PYTHON_VERSION: "3.13"
  PYYAML_VERSION: "6.0.3"
  NODE_VERSION: "24"
  # Claude Code CLI used by the validate job. Bump deliberately: newer releases
  # can add validation checks.
  CLAUDE_CODE_VERSION: "2.1.323"

jobs:
  lint:
    name: lint
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    env:
      # Shell files held to shellcheck and shfmt, as git pathspecs. Formatting
      # style comes from .editorconfig.
      SHELL_FILES: scripts/*.sh scripts/_lib/*.bash hooks/pre-commit/*.sh tests/run.sh tests/scripts/helpers.bash
      # sha256 values are the digests GitHub records for these release assets.
      SHELLCHECK_VERSION: "0.11.0"
      SHELLCHECK_SHA256: "8c3be12b05d5c177a04c29e3c78ce89ac86f1595681cab149b65b97c4e227198"
      SHFMT_VERSION: "3.14.1"
      SHFMT_SHA256: "76e77641faa025814b77f153b29796b8e6fa2fca03e0c76a691608b86c7ea7bf"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install PyYAML
        run: python -m pip install --disable-pip-version-check "pyyaml==${PYYAML_VERSION}"

      - name: JSON manifests parse
        run: |
          for f in .claude-plugin/plugin.json .claude-plugin/marketplace.json hooks/hooks.json bootstrap-manifest.json; do
            jq -e . "$f" > /dev/null || { echo "::error file=$f::$f is not valid JSON"; exit 1; }
          done

      - name: bootstrap-manifest.json is current
        run: scripts/build-manifest.sh --check

      - name: Agent and skill frontmatter is strict YAML
        run: python .github/scripts/lint-frontmatter.py agents/*.md skills/*/SKILL.md .claude/skills/*/SKILL.md

      - name: Relative Markdown links resolve
        run: python .github/scripts/check-links.py

      - name: Install shellcheck and shfmt
        run: |
          bin="$RUNNER_TEMP/bin"
          mkdir -p "$bin"
          curl -fsSL --retry 3 -o "$RUNNER_TEMP/shellcheck.tar.xz" \
            "https://github.com/koalaman/shellcheck/releases/download/v${SHELLCHECK_VERSION}/shellcheck-v${SHELLCHECK_VERSION}.linux.x86_64.tar.xz"
          echo "${SHELLCHECK_SHA256}  $RUNNER_TEMP/shellcheck.tar.xz" | sha256sum -c -
          tar -xJf "$RUNNER_TEMP/shellcheck.tar.xz" -C "$bin" --strip-components=1 "shellcheck-v${SHELLCHECK_VERSION}/shellcheck"
          curl -fsSL --retry 3 -o "$bin/shfmt" \
            "https://github.com/mvdan/sh/releases/download/v${SHFMT_VERSION}/shfmt_v${SHFMT_VERSION}_linux_amd64"
          echo "${SHFMT_SHA256}  $bin/shfmt" | sha256sum -c -
          chmod +x "$bin/shellcheck" "$bin/shfmt"
          echo "$bin" >> "$GITHUB_PATH"

      # Info-level notes are advisory; warnings and errors fail the job.
      - name: Shell scripts pass shellcheck
        run: |
          set -f  # SHELL_FILES holds git pathspecs; keep bash from globbing them
          shellcheck --version
          git ls-files -z -- $SHELL_FILES | xargs -0 shellcheck -x --source-path=SCRIPTDIR --severity=warning

      - name: Shell scripts are shfmt-formatted
        run: |
          set -f  # SHELL_FILES holds git pathspecs; keep bash from globbing them
          shfmt --version
          git ls-files -z -- $SHELL_FILES | xargs -0 shfmt -d

  validate:
    name: validate
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          package-manager-cache: false

      - name: Install Claude Code CLI
        run: npm install --global --no-audit --no-fund "@anthropic-ai/claude-code@${CLAUDE_CODE_VERSION}"

      # Warnings (such as the root CLAUDE.md not being loaded as plugin
      # context) are reported but do not fail the job; --strict would.
      - name: claude plugin validate
        env:
          CLAUDE_CODE_DISABLE_NONESSENTIAL_TRAFFIC: "1"
        run: |
          claude --version
          claude plugin validate . --json

  test:
    name: test
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive
          persist-credentials: false

      # PyYAML lets the ci.yml rendering tests parse their output instead of
      # skipping.
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install PyYAML
        run: python -m pip install --disable-pip-version-check "pyyaml==${PYYAML_VERSION}"

      - name: Run the bats suite
        run: tests/run.sh
