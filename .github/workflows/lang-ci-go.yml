# Reusable CI for Go. A caller job runs this workflow through `uses:` and may
# set `directory` (the repository root by default) and `timeout-minutes` (30 by
# default).
#
# Pin bumps: callers in other repositories pin the lang-ci-<id>.yml files to
# the SHA of one main commit, and a commit can't contain its own SHA. A change
# here therefore merges to main in its own PR, and the callers' pins move to
# that main commit afterwards.

name: lang-ci-go
on:
  workflow_call:
    inputs:
      directory:
        type: string
        default: "."
      timeout-minutes:
        type: number
        default: 30
permissions:
  contents: read
jobs:
  go:
    runs-on: ubuntu-latest
    timeout-minutes: ${{ inputs.timeout-minutes }}
    defaults:
      run:
        working-directory: ${{ inputs.directory }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: ${{ inputs.directory }}/go.mod
          cache-dependency-path: ${{ inputs.directory }}/go.mod
      - run: |
          if [ -n "$(go env GOWORK)" ] && ! go list -m -f '{{.Dir}}' | grep -qxF "$PWD"; then export GOWORK=off; fi
          go build ./...
          go test ./...
