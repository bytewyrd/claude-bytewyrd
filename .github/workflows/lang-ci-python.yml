# Reusable CI for Python. A caller job runs this workflow through `uses:` and
# may set `directory` (the repository root by default) and `timeout-minutes`
# (30 by default).
#
# Pin bumps: callers in other repositories pin the lang-ci-<id>.yml files to
# the SHA of one main commit, and a commit can't contain its own SHA. A change
# here therefore merges to main in its own PR, and the callers' pins move to
# that main commit afterwards.

name: lang-ci-python
on:
  workflow_call:
    inputs:
      directory:
        type: string
        default: "."
      timeout-minutes:
        type: number
        default: 30
permissions:
  contents: read
jobs:
  python:
    runs-on: ubuntu-latest
    timeout-minutes: ${{ inputs.timeout-minutes }}
    defaults:
      run:
        working-directory: ${{ inputs.directory }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          working-directory: ${{ inputs.directory }}
      - run: |
          if [ -f uv.lock ]; then uv sync --all-packages --locked; else uv sync --all-packages; fi
          uv run pytest || [ "$?" -eq 5 ]
