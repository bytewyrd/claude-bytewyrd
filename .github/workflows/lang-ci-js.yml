# Reusable CI for JavaScript/TypeScript. A caller job runs this workflow
# through `uses:` and may set `directory` (the repository root by default) and
# `timeout-minutes` (30 by default).
#
# Pin bumps: callers in other repositories pin the lang-ci-<id>.yml files to
# the SHA of one main commit, and a commit can't contain its own SHA. A change
# here therefore merges to main in its own PR, and the callers' pins move to
# that main commit afterwards.

name: lang-ci-js
on:
  workflow_call:
    inputs:
      directory:
        type: string
        default: "."
      timeout-minutes:
        type: number
        default: 30
permissions:
  contents: read
jobs:
  js:
    runs-on: ubuntu-latest
    timeout-minutes: ${{ inputs.timeout-minutes }}
    defaults:
      run:
        working-directory: ${{ inputs.directory }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
      - run: |
          if [ -f bun.lock ] || [ -f bun.lockb ]; then bun install --frozen-lockfile; else bun install; fi
          bun test --pass-with-no-tests
