# Development and CI only. The plugin runs on Python 3.11 or newer with the
# standard library and scripts/_vendor/, installs nothing, and needs no uv
# (RFC 2026-11-09-scaffold-and-drift, Language policy and D8).
#
# `uv sync --locked` installs the dev group as uv.lock pins it, and only
# `uv lock` writes uv.lock. uv needs the [project] table: without it, `uv lock`
# takes requires-python from the interpreter it runs. package = false keeps uv
# from building or installing this project.

[project]
name = "claude-bytewyrd-dev"
version = "0"
requires-python = ">=3.11"

[dependency-groups]
dev = [
  "pytest==9.2.0",
  "pyyaml==6.0.3",
  "ruff==0.17.5",
  "mypy==2.4.1",
  "types-pyyaml==6.0.12.20261113",
]

[tool.uv]
package = false

# The tests import the bytewyrd package, and the vendored PyYAML, from where
# the bootstrap puts them on sys.path. The lang-ci python fixture has no pytest
# table of its own, so its pytest run reads this one too: keep it to this.
[tool.pytest]
pythonpath = ["scripts", "scripts/_vendor"]

# ruff lints and formats the repository's own Python. It never touches
# scripts/_vendor, PyYAML's sdist as it ships, or the bats submodules, which
# are other projects' code: force-exclude keeps them out even when a path
# under them is passed to ruff. src makes bytewyrd a first-party import.
[tool.ruff]
line-length = 120
target-version = "py311"
src = ["scripts"]
force-exclude = true
extend-exclude = [
  "scripts/_vendor",
  "tests/bats-assert",
  "tests/bats-core",
  "tests/bats-file",
  "tests/bats-support",
  "*.md",  # D7 has ruff on the plugin's Python, not Markdown docs; this also skips sandbox placeholders like .claude/loop.md
]

# ruff's classic defaults (its default set before 0.16) plus import sorting.
# The newer default set flags the deliberate catch-all handlers that keep
# hooks and main() from failing, subprocess calls whose return codes the code
# checks itself, and (UP) the %-formatting and the bootstrap's version check.
# Widening it is a separate change, because #117 must not change behaviour.
[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

# mypy --strict checks the package, as `uv run --no-sync mypy` with no
# arguments. mypy_path finds bytewyrd under scripts/; scripts/_vendor stays off
# mypy's path, so yaml is types-PyYAML's stubs, not the untyped vendored copy.
# The extra error codes found nothing when they were added: every type: ignore
# names its code, and no name is possibly undefined, no expression redundant,
# and no object tested for a truth value it always has.
[tool.mypy]
strict = true
python_version = "3.11"
files = ["scripts/bytewyrd"]
mypy_path = "scripts"
enable_error_code = ["ignore-without-code", "possibly-undefined", "redundant-expr", "truthy-bool", "truthy-iterable"]

# The bootstrap, scripts/bytewyrd/__main__.py, is the one module an old
# interpreter parses before the version check that sends it away, so it stays
# free of annotations and newer syntax (B2). mypy still checks its function
# bodies, but does not ask for annotations there, or on the calls it makes.
[[tool.mypy.overrides]]
module = "bytewyrd.__main__"
disallow_untyped_defs = false
disallow_untyped_calls = false
